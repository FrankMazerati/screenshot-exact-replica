name: Verify application

on:
  push:
    branches:
      - main
      - integration/consolidate-foundations
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: Commit bun.lock if changed
        run: |
          git diff --quiet && git diff --cached --quiet || {
            git config user.name github-actions[bot]
            git config user.email github-actions[bot]@users.noreply.github.com
            git add bun.lock
            git commit -m "Automate bun.lock update" || true
            git push
          }

      - name: Type check
        run: bunx tsc --noEmit

      - name: Run tests
        run: bun run test

      - name: Run lint
        run: bun run lint

      - name: Run build
        run: bun run build
